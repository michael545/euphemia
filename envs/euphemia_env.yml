# euphemia_env.yml
name: euphemia_env       
channels:
  - defaults               # primary channel; could also use conda-forge
dependencies:
  - python=3.12.7           # --version for consistency
  - pip
  - graphviz              # Graphviz binaries (dot, neato)
  - python-graphviz       # Python bindings for Graphviz
  - icu>=73.1             # prevent unintentional downgrades
  - ipython
  - black


